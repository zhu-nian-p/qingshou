<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>青售 · 登录 / 注册</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.8.8/dist/index.css">
<style>
  :root {
    --teal: #14b8a6; --teal-dark: #0f766e; --mint: #f0fdfa; --ink: #0f2e2a; --gray: #6b7f7c;
    --el-color-primary: #14b8a6;
    --el-color-primary-light-3: #4dd4c4;
    --el-color-primary-light-5: #7fe3d7;
    --el-color-primary-light-7: #b3f0e9;
    --el-color-primary-light-9: #e6fffa;
    --el-color-primary-dark-2: #0f9b8d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 8% -10%, #ccfbf1 0%, rgba(204,251,241,0) 60%),
      radial-gradient(800px 380px at 100% 0%, #d1fae5 0%, rgba(209,250,229,0) 55%),
      linear-gradient(180deg, #f2fffc 0%, #ffffff 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; min-height: 100vh; min-height: 100dvh;
  }
  .login-wrap { width: 100%; max-width: 430px; }
  .brand { text-align: center; margin-bottom: 18px; }
  .logo {
    font-size: 38px; font-weight: 800; letter-spacing: 4px;
    background: linear-gradient(135deg, #0d9488, #2dd4bf 60%, #67e8f9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .slogan { margin-top: 6px; font-size: 13px; color: var(--gray); letter-spacing: 1px; }

  .card {
    background: rgba(255,255,255,0.94);
    border: 1px solid #d9f3ee;
    border-radius: 22px;
    box-shadow: 0 18px 50px rgba(13,148,136,0.12);
    padding: 22px 22px 24px;
  }

  /* 自定义 Tab */
  .tabs { display: flex; background: #ecfdf9; border-radius: 14px; padding: 5px; margin-bottom: 20px; }
  .tabs button {
    flex: 1; border: none; background: transparent; color: var(--gray);
    font-size: 15px; font-weight: 600; padding: 10px 0; border-radius: 10px;
    cursor: pointer; transition: all .18s ease;
  }
  .tabs button.active {
    background: #ffffff; color: var(--teal-dark);
    box-shadow: 0 4px 12px rgba(13,148,136,0.15);
  }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #36635c; margin-bottom: 6px; font-weight: 600; }
  .field .el-input__wrapper { border-radius: 12px; }
  .code-row { display: flex; gap: 10px; }
  .code-row .el-input { flex: 1 1 auto; }
  .code-btn {
    flex: 0 0 auto; min-width: 112px; border-radius: 12px;
    background: linear-gradient(135deg, #14b8a6, #0d9488); border: none; color: #fff;
    font-weight: 600;
  }
  .code-btn.is-disabled { background: #cfe9e4 !important; color: #ffffff !important; }

  .submit-btn {
    width: 100%; height: 46px; margin-top: 6px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #14b8a6, #0d9488); color: #fff;
    font-size: 16px; font-weight: 700; letter-spacing: 1px; cursor: pointer;
    box-shadow: 0 10px 22px rgba(13,148,136,0.25);
  }
  .submit-btn:active { transform: translateY(1px); }
  .submit-btn[disabled] { opacity: .65; cursor: not-allowed; }

  .foot { margin-top: 18px; text-align: center; font-size: 12px; color: #9bb5b0; }

  .el-message { border-radius: 12px; }

  @media (max-width: 480px) {
    .card { padding: 18px 16px 20px; border-radius: 18px; }
    .logo { font-size: 32px; }
    body { padding: 18px 12px; }
  }
</style>
</head>

<body>
<div id="app" class="login-wrap">
  <div class="brand">
    <div class="logo">青售</div>
    <div class="slogan">校园二手 · 同校面交更安心</div>
  </div>

  <div class="card">
    <div class="tabs">
      <button :class="{ active: tab === 'login' }" @click="switchTab('login')">登录</button>
      <button :class="{ active: tab === 'register' }" @click="switchTab('register')">注册</button>
    </div>

    <!-- 登录 -->
    <div v-if="tab === 'login'">
      <div class="field">
        <label>用户名</label>
        <el-input v-model="loginForm.username" size="large" placeholder="请输入用户名" clearable @keyup.enter="doLogin"></el-input>
      </div>
      <div class="field">
        <label>密码</label>
        <el-input v-model="loginForm.password" size="large" type="password" show-password placeholder="请输入密码" @keyup.enter="doLogin"></el-input>
      </div>
      <button class="submit-btn" :disabled="loading" @click="doLogin">{{ loading ? '登录中…' : '登 录' }}</button>
      <div class="foot">还没有账号？点击上方「注册」，用学校邮箱完成验证</div>
    </div>

    <!-- 注册 -->
    <div v-else>
      <div class="field">
        <label>用户名</label>
        <el-input v-model="regForm.username" size="large" placeholder="4-20 位字母、数字或下划线" clearable></el-input>
      </div>
      <div class="field">
        <label>密码</label>
        <el-input v-model="regForm.password" size="large" type="password" show-password placeholder="6-32 位密码"></el-input>
      </div>
      <div class="field">
        <label>真实姓名</label>
        <el-input v-model="regForm.realName" size="large" placeholder="用于线下交易核验" clearable></el-input>
      </div>
      <div class="field">
        <label>学号</label>
        <el-input v-model="regForm.studentId" size="large" placeholder="8-9 位数字" maxlength="9" clearable></el-input>
      </div>
      <div class="field">
        <label>学校邮箱</label>
        <el-input v-model="regForm.schoolEmail" size="large" placeholder="如：20240001@xxx.edu.cn" clearable></el-input>
      </div>
      <div class="field">
        <label>邮箱验证码</label>
        <div class="code-row">
          <el-input v-model="regForm.emailCode" size="large" placeholder="6 位验证码" maxlength="6" clearable @keyup.enter="doRegister"></el-input>
          <el-button class="code-btn" size="large" :disabled="countdown > 0" @click="sendCode">
            {{ countdown > 0 ? countdown + 's 后重发' : '获取验证码' }}
          </el-button>
        </div>
      </div>
      <button class="submit-btn" :disabled="loading" @click="doRegister">{{ loading ? '注册中…' : '注 册' }}</button>
      <div class="foot">注册即表示同意青售校园二手交易规范</div>
    </div>
  </div>

  <div class="foot" style="margin-top:14px">青售 · 只做校园里的好物</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2.8.8/dist/index.full.min.js"></script>
<script>
  const { createApp, ref, reactive, onUnmounted } = Vue;
  const API_BASE = 'http://localhost:8080';
  const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.edu\.cn$/;

  createApp({
    setup() {
      const tab = ref('login');
      const loading = ref(false);
      const countdown = ref(0);
      let timer = null;

      const loginForm = reactive({ username: '', password: '' });
      const regForm = reactive({
        username: '', password: '', realName: '',
        studentId: '', schoolEmail: '', emailCode: ''
      });

      function switchTab(t) {
        tab.value = t;
        loading.value = false;
      }

      async function api(path, body) {
        const res = await fetch(API_BASE + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body || {})
        });
        let json = {};
        try { json = await res.json(); } catch (e) { /* ignore */ }
        if (!res.ok || json.code !== 200) {
          throw new Error(json.message || ('请求失败（HTTP ' + res.status + '）'));
        }
        return json;
      }

      function startCountdown() {
        countdown.value = 60;
        if (timer) clearInterval(timer);
        timer = setInterval(() => {
          countdown.value -= 1;
          if (countdown.value <= 0) {
            clearInterval(timer);
            timer = null;
            countdown.value = 0;
          }
        }, 1000);
      }
      onUnmounted(() => { if (timer) clearInterval(timer); });

      async function sendCode() {
        if (countdown.value > 0) return;
        const email = (regForm.schoolEmail || '').trim();
        if (!EMAIL_RE.test(email)) {
          ElementPlus.ElMessage.warning('请输入 .edu.cn 结尾的学校邮箱');
          return;
        }
        try {
          await api('/api/user/send-code', { email });
          ElementPlus.ElMessage.success('验证码已发送，请查收学校邮箱（5 分钟内有效）');
          startCountdown();
        } catch (e) {
          ElementPlus.ElMessage.error(e.message);
        }
      }

      function saveSession(data) {
        localStorage.setItem('qingshou_token', data.token);
        localStorage.setItem('qingshou_user', JSON.stringify({
          userId: data.userId, username: data.username,
          realName: data.realName, role: data.role
        }));
      }

      async function doLogin() {
        if (!loginForm.username.trim() || !loginForm.password) {
          ElementPlus.ElMessage.warning('请输入用户名和密码');
          return;
        }
        loading.value = true;
        try {
          const json = await api('/api/user/login', {
            username: loginForm.username.trim(),
            password: loginForm.password
          });
          saveSession(json.data);
          ElementPlus.ElMessage.success('登录成功，正在进入青售…');
          setTimeout(() => { location.href = 'index.html'; }, 400);
        } catch (e) {
          ElementPlus.ElMessage.error(e.message);
        } finally {
          loading.value = false;
        }
      }

      async function doRegister() {
        const f = regForm;
        if (!/^[A-Za-z0-9_]{4,20}$/.test(f.username.trim())) {
          ElementPlus.ElMessage.warning('用户名需为 4-20 位字母、数字或下划线');
          return;
        }
        if (!f.password || f.password.length < 6 || f.password.length > 32) {
          ElementPlus.ElMessage.warning('密码长度需为 6-32 位');
          return;
        }
        if (!f.realName.trim()) {
          ElementPlus.ElMessage.warning('请填写真实姓名');
          return;
        }
        if (!/^\d{8,9}$/.test(f.studentId.trim())) {
          ElementPlus.ElMessage.warning('学号必须是 8-9 位数字');
          return;
        }
        if (!EMAIL_RE.test(f.schoolEmail.trim())) {
          ElementPlus.ElMessage.warning('请使用 .edu.cn 结尾的学校邮箱');
          return;
        }
        if (!/^\d{6}$/.test(f.emailCode.trim())) {
          ElementPlus.ElMessage.warning('请输入 6 位邮箱验证码');
          return;
        }

        loading.value = true;
        try {
          await api('/api/user/register', {
            username: f.username.trim(),
            password: f.password,
            realName: f.realName.trim(),
            studentId: f.studentId.trim(),
            schoolEmail: f.schoolEmail.trim(),
            emailCode: f.emailCode.trim()
          });
          // 注册成功后端不返回 token，这里自动登录一次
          const json = await api('/api/user/login', {
            username: f.username.trim(),
            password: f.password
          });
          saveSession(json.data);
          ElementPlus.ElMessage.success('注册成功，正在进入青售…');
          setTimeout(() => { location.href = 'index.html'; }, 500);
        } catch (e) {
          ElementPlus.ElMessage.error(e.message);
        } finally {
          loading.value = false;
        }
      }

      return {
        tab, loading, countdown, loginForm, regForm,
        switchTab, sendCode, doLogin, doRegister
      };
    }
  }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
