server:
  port: 8080
  # Tomcat 工作目录固定到项目内，不要用系统 %TEMP%。
  # 本机系统临时目录对普通进程会拒绝创建子目录，表现为启动时报：
  #   Unable to create tempDir ... AccessDeniedException: C:\Users\...\Temp\tomcat.8080.xxx
  tomcat:
    basedir: ./.run/tomcat

spring:
  application:
    name: qingshou
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 与本地 Docker MySQL 一致。YAML 里含 & 的连接串必须加引号。
    url: "jdbc:mysql://localhost:3306/campus_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: root
    password: "123456"
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
  servlet:
    multipart:
      # 单张图片最大 5MB，单次请求最大 10MB
      max-file-size: 5MB
      max-request-size: 10MB
  mail:
    # QQ 邮箱 SMTP（465 + SSL）。账号和授权码从环境变量读取，见 .env.local
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_AUTH_CODE:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

# 图片上传目录。相对路径按「启动时的工作目录」解析，默认 backend/uploads
# 通过 /uploads/** 静态映射对外访问
app:
  upload-dir: uploads
  # 敏感词库（外置，随时增删；发布/编辑商品时命中即拒绝）
  sensitive-words:
    - 代写
    - 违禁
    - 诈骗
    - 枪支
    - 毒品
    - 假证
    - 刷单
    - 代考
  # 每个用户最多上传 50 张图片（防刷接口打满磁盘）
  upload:
    max-per-user: 50
  # 允许的前端来源（逗号分隔）；生产环境用 CORS_ALLOWED_ORIGINS 覆盖为正式域名
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
  mail:
    # 邮件发件人显示名称
    sender-name: 青售官方团队
    # 验证码有效期（分钟）与同一邮箱发送间隔（秒），调整时同步改 EmailCodeService 的常量说明
    code-expire-minutes: 5
    send-interval-seconds: 60

# 表名 order 是 MySQL 保留字。table-format / column-format 会给 MyBatis-Plus
# 自动生成的表名、字段名加上反引号，后续订单模块不用再手写转义。
# 自己写 @Select 等原生 SQL 时，仍然要写成 `order`。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-format: "`%s`"
      column-format: "`%s`"

jwt:
  # 生产密钥只从环境变量 JWT_SECRET 读取（见 .env.local / 服务器环境变量），不要写死在代码里
  secret: ${JWT_SECRET:}
  expire-hours: 24

# 订单超时自动取消
# timeout-hours: 待卖家确认超过多少小时自动取消（默认 24）
# timeout-cron : 扫描频率（默认每 10 分钟）。本地想快速验证可改成 "*/10 * * * * *"（每 10 秒）
order:
  timeout-hours: 24
  # 待面交超过多少天自动取消（买家确认后长期失联）
  meet-timeout-days: 3
  timeout-cron: "0 */10 * * * *"

# DeepSeek AI 文案生成
# api-key 从环境变量 DEEPSEEK_API_KEY 读取（启动脚本会自动加载项目根目录的 .env.local）。
# 未设置时 /api/ai/generate-desc 会返回模拟文案（mock=true），不影响其他接口。
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-chat

# 置顶收费：阶梯定价（1天1元 / 7天5元 / 30天12元）
# 金额只在 TopUpService 中按天数计算并落库，不接受前端传入的金额。
